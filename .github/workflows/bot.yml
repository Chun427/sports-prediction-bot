name: bot-runtime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: tick (push)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tick (push)
        env:
          DRY_RUN: "false"
          ODDS_API_KEY_1: ${{ secrets.ODDS_API_KEY_1 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python src/sports_prediction.py push

      # 狀態持久化：即使上一步失敗仍須執行。
      # 原因：mark_pushed() 送出即落盤，flags.json 為去重依據；
      # 若失敗時不 commit，下一輪將重讀舊 flags → 重複推播。
      # 本步驟僅執行 git 操作，不得含任何 runtime 行為。
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in flags.json weekly_games.json predictions.json key_state.json verified_history.csv; do
            [ -f "$f" ] && git add -- "$f" || true
          done
          if ! git diff --staged --quiet; then
            git commit -q -m "[skip ci] update bot state" || true
            git pull --rebase --autostash -q || true
            git push -q || true
          fi
